[package]
name = "s3dive"
version = "0.1.0"
description = "Visual interface for rclone: S3 remotes, sync jobs and mounts"
authors = ["S3Dive contributors"]
edition = "2021"
rust-version = "1.77"

# The core crate is a member, so one lockfile covers both crates and the
# standalone test run of the core uses the same resolved versions.
[workspace]
members = ["core"]

[lib]
name = "s3dive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
s3dive-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros"] }

[features]
# This feature is used for production builds where `devPath` points to the filesystem.
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
